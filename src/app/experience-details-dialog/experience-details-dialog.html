<div class="experience-detail">
  @for (role of data.roles; track $index) {
    <h1 class="role-title">{{role.title}}</h1>
    <h3 class="role-period">{{role.rolePeriod}}</h3>
    <p class="role-description">{{role.description}}</p>
    <p></p>
    <p class="role-description"><b>Tech stack:</b> <i>{{role.techStack}}</i></p>
  }
</div>
